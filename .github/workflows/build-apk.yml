name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} output/rili.apk \;
          ls -lh output/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rili-apk
          path: output/rili.apk
          retention-days: 30
