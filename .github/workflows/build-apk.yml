name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Show preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -1 "$ANDROID_HOME" 2>/dev/null || true
          ls -1 "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls -1 "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Accept licenses & install components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then ./gradlew assembleDebug --no-daemon --stacktrace
          else gradle assembleDebug --no-daemon --stacktrace; fi

      - name: Collect APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} output/rili.apk \;
          ls -lh output/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rili-apk
          path: output/rili.apk
          retention-days: 30
