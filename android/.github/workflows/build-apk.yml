name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show tree
        run: ls -la android/ && ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace --warning-mode=all

      - name: Rename APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} output/rili.apk \;
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rili-apk
          path: output/rili.apk
          retention-days: 30
